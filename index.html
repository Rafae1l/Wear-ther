<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wear-ther | Digital Closet</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Top Navigation (Hend will continue) -->
  <header class="app-header">
    <div class="logo">WEAR-THER</div>
    <nav class="nav-links">
      <button id="nav-home-btn" class="nav-btn">Home</button>
      <button id="nav-closet-btn" class="nav-btn active">My Closet</button>
    </nav>
  </header>

  <main class="main-container">

    <!-- HOME SCREEN (some work done) -->
    <!-- HOME SCREEN: Dowlah's outfit suggestion interface. -->
    <!-- Keep this ID and class so the existing navigation still works. -->
    <section id="screen-home" class="screen-view">


      <!-- Rafael's weather integration will update this information.
        We do not show a made-up temperature. -->
      <div class="outfit-weather-panel">
        <h2>Today's Weather</h2>
        <p id="outfit-weather-summary">
          Weather is currently unavailable.
        </p>
      </div>

      <!-- This section will display the suggested clothing combination. -->
      <div class="outfit-section">
        <h2>Suggested Outfit</h2>
        <p>Replace individual pieces to customize your outfit.</p>

        <!-- JavaScript will add clothing cards using saved closet items.
         Each card will include its photo, name, and Replace button. -->
        <div id="outfit-grid" class="outfit-grid"></div>
      </div>

      <!-- This chooser stays hidden until someone clicks Replace. -->
      <div id="outfit-replacement-panel" class="hidden">
        <h3 id="outfit-replacement-title">Choose a replacement</h3>

        <!-- JavaScript will show matching clothing categories here.
         For example, replacing a top will show other tops. -->
        <div id="outfit-replacement-options"></div>

        <!-- Cancel will close the chooser and keep the current outfit.
         We will connect this button in the JavaScript step. -->
        <button id="outfit-cancel-replacement" class="primary-pill-btn" type="button">
          Cancel
        </button>
      </div>

      <!-- Confirmation messages will appear here after a replacement.
       role="status" also announces updates to screen-reader users. -->
      <p id="outfit-feedback" role="status"></p>
    </section>

    <section id="screen-closet" class="screen-view active">
      <div class="closet-top-bar">
        <h2>My Closet</h2>
        <button id="open-add-modal-btn" class="primary-pill-btn">+ Add Piece</button>
      </div>

      <!-- Category Filter Tabs -->
      <div class="category-tabs">
        <button class="cat-tab active" data-category="all">All</button>
        <button class="cat-tab" data-category="top">Tops</button>
        <button class="cat-tab" data-category="bottom">Bottoms</button>
        <button class="cat-tab" data-category="outerwear">Outerwear</button>
        <button class="cat-tab" data-category="shoes">Shoes</button>
      </div>

      <!-- Garment Display Grid (Rendered from LocalStorage) -->
      <div id="closet-grid" class="closet-grid">
        <!-- Dynamic clothing cards render here -->
      </div>
    </section>

  </main>

  <div id="add-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Add Clothing</h3>
        <button id="close-modal-btn" class="close-x" type="button">&times;</button>
      </div>

      <form id="add-clothing-form">
        <div class="form-group">
          <label for="item-name">Clothing Name</label>
          <input type="text" id="item-name" placeholder="e.g., Gray Sweater" required>
        </div>

        <div class="form-group">
          <label for="item-category">Category</label>
          <select id="item-category" required>
            <option value="" disabled selected>Select Category</option>
            <option value="top">Top</option>
            <option value="bottom">Bottom</option>
            <option value="outerwear">Outerwear</option>
            <option value="shoes">Shoes</option>
          </select>
        </div>

        <div class="form-group">
          <label for="item-color">Color</label>
          <select id="item-color" required>
            <option value="" disabled selected>Select Color</option>
            <option value="gray">Gray</option>
            <option value="white">White</option>
            <option value="black">Black</option>
            <option value="blue">Blue</option>
            <option value="navy">Navy</option>
            <option value="beige">Beige</option>
          </select>
        </div>

        <div class="form-group">
          <label>Weather Suitability</label>
          <div class="radio-options">
            <label><input type="radio" name="warmth" value="warm" required> Warm</label>
            <label><input type="radio" name="warmth" value="cool"> Cool</label>
            <label><input type="radio" name="warmth" value="cold"> Cold</label>
          </div>
        </div>

        <div class="form-group">
          <label for="item-image-input">Upload Photo</label>
          <input type="file" id="item-image-input" accept="image/*" required>
        </div>

        <div class="modal-actions">
          <button type="submit" class="primary-pill-btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
